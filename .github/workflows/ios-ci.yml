name: iOS CI (simulator build — no signing required)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  WHISPER_MODEL: ggml-base.en.bin
  WHISPER_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
  SIMULATOR_DEVICE: "iPhone 15"

jobs:
  build-and-run-simulator:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('Podfile') }}

      - name: Cache whisper model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: PrivateMediaStudio/Resources/Models/${{ env.WHISPER_MODEL }}
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Download whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p PrivateMediaStudio/Resources/Models
          curl -L "$WHISPER_MODEL_URL" -o "PrivateMediaStudio/Resources/Models/$WHISPER_MODEL"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods deps
        run: pod install --repo-update

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace PrivateMediaStudio.xcworkspace \
            -scheme PrivateMediaStudio \
            -destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE" \
            | xcbeautify || true

      - name: Boot simulator and install app
        run: |
          UDID=$(xcrun simctl list devices available | grep "$SIMULATOR_DEVICE" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PrivateMediaStudio.app" -path "*iphonesimulator*" | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Launch app and capture proof-of-life screenshot
        run: |
          xcrun simctl launch "$SIM_UDID" com.privatemediastudio.app
          sleep 5
          mkdir -p artifacts
          xcrun simctl io "$SIM_UDID" screenshot artifacts/launch-screenshot.png

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: |
            artifacts/
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

