name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false

env:
  WHISPER_MODEL: ggml-base.en.bin
  WHISPER_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
  SIMULATOR_DEVICE: "iPhone 16"

jobs:
  # ---------------------------------------------------------------------------
  # Simulator build. Requires no signing material, so it runs on every push and
  # on pull requests from forks (which receive no secrets at all).
  # ---------------------------------------------------------------------------
  build-and-run-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Falls back to the placeholder defaults in configure.sh when the secret
      # is absent, which is exactly what fork PRs need in order to still build.
      - name: Configure identifiers
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/configure.sh

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('Podfile') }}

      - name: Cache FFmpegKit
        uses: actions/cache@v4
        with:
          path: Vendor/ffmpeg-kit
          key: ffmpegkit-${{ hashFiles('Vendor/ffmpeg-kit/*.podspec') }}

      - name: Cache whisper model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: PrivateMediaStudio/Resources/Models/${{ env.WHISPER_MODEL }}
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Download whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p PrivateMediaStudio/Resources/Models
          curl -L "$WHISPER_MODEL_URL" -o "PrivateMediaStudio/Resources/Models/$WHISPER_MODEL"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Populates Vendor/ffmpeg-kit from our own release asset. Upstream
      # ffmpeg-kit binaries were removed from CocoaPods in April 2025, so
      # `pod install` cannot resolve them any more — see FFMPEG.md.
      - name: Fetch FFmpegKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-ffmpegkit.sh

      - name: Install CocoaPods deps
        run: pod install --repo-update

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace PrivateMediaStudio.xcworkspace \
            -scheme PrivateMediaStudio \
            -destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE" \
            | xcbeautify

      # This project was scaffolded against APIs that do not all exist, so
      # build failures are usually signature mismatches rather than logic
      # errors. Rather than guess and burn a CI round trip per guess, dump the
      # real third-party headers whenever the build fails — one artifact gives
      # the ground truth for every remaining mismatch at once.
      - name: Dump third-party API headers
        if: failure()
        run: |
          mkdir -p artifacts/headers
          for name in FFmpegKit.h FFmpegSession.h AbstractSession.h ReturnCode.h Statistics.h \
                      VLCMediaListPlayer.h VLCMediaPlayer.h VLCMediaList.h VLCMedia.h; do
            find Pods Vendor -name "$name" -exec cp {} artifacts/headers/ \; 2>/dev/null || true
          done
          find ~/Library/Developer/Xcode/DerivedData -path "*SwiftWhisper*" -name "*.swiftinterface" \
            -exec cp {} artifacts/headers/ \; 2>/dev/null || true
          ls -1 artifacts/headers/ || echo "(no headers found)"

      - name: Upload API headers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-headers
          path: artifacts/headers/

      - name: Boot simulator and install app
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID || 'com.example.privatemediastudio' }}
        run: |
          UDID=$(xcrun simctl list devices available | grep -F "$SIMULATOR_DEVICE (" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "APP_BUNDLE_ID=$APP_BUNDLE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PrivateMediaStudio.app" -path "*iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app was produced — the build step failed silently." >&2
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Launch app and capture proof-of-life screenshot
        run: |
          xcrun simctl launch "$SIM_UDID" "$APP_BUNDLE_ID"
          sleep 5
          mkdir -p artifacts
          xcrun simctl io "$SIM_UDID" screenshot artifacts/launch-screenshot.png

      # Build logs are NOT uploaded. An .xcactivitylog contains the fully
      # resolved build settings, including PRODUCT_BUNDLE_IDENTIFIER and
      # DEVELOPMENT_TEAM in plaintext. GitHub masks secret values in console
      # output but does nothing to the contents of uploaded artifact files,
      # so publishing them would defeat keeping these identifiers private.
      # If you need them to debug a failure, run the build locally instead.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build
          path: artifacts/

  # ---------------------------------------------------------------------------
  # Signed archive + TestFlight upload. Runs only on a manual dispatch with the
  # "release" input checked, so ordinary pushes to main do not burn a build
  # number or spam TestFlight.
  #
  # Required repo secrets:
  #   APP_BUNDLE_ID                     - e.g. com.yourname.app
  #   APPLE_TEAM_ID                     - 10-character Team ID
  #   BUILD_CERTIFICATE_P12_BASE64      - Apple Distribution cert, base64 .p12
  #   BUILD_CERTIFICATE_PASSWORD        - password used when exporting the .p12
  #   PROVISIONING_PROFILE_BASE64       - base64 App Store provisioning profile
  #   APPSTORE_CONNECT_API_KEY_BASE64   - base64 App Store Connect API .p8 key
  #   APPSTORE_CONNECT_API_KEY_ID       - that key's Key ID
  #   APPSTORE_CONNECT_API_ISSUER_ID    - your App Store Connect Issuer ID
  # ---------------------------------------------------------------------------
  archive-testflight:
    runs-on: macos-15
    timeout-minutes: 60
    needs: build-and-run-simulator
    if: github.event_name == 'workflow_dispatch' && inputs.release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Secrets are not exposed to `run:` automatically — every step that reads
      # one needs it mapped in via `env:`, or the shell variable is silently
      # empty and the failure surfaces much later as a confusing signing error.
      - name: Install signing identity into a dedicated CI keychain
        env:
          BUILD_CERTIFICATE_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | sed 's/"//g')
          echo "$BUILD_CERTIFICATE_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k ci.keychain -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci ci.keychain
          rm -f cert.p12

      # The profile's own Name is what PROVISIONING_PROFILE_SPECIFIER and
      # ExportOptions must match, so read it out of the profile rather than
      # maintaining it as a ninth secret that can drift out of sync.
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          rm -f profile.plist

      - name: Install App Store Connect API key
        env:
          APPSTORE_CONNECT_API_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_CONNECT_API_KEY_ID}.p8

      # PROVISIONING_PROFILE_NAME arrives from $GITHUB_ENV, set two steps above.
      - name: Configure identifiers
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/configure.sh

      # exportOptions needs a bundle-id -> profile-name mapping under manual
      # signing. Both halves are dynamic, so build the dict here instead of
      # committing it.
      - name: Add provisioningProfiles mapping to ExportOptions
        env:
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${APP_BUNDLE_ID} string ${PROVISIONING_PROFILE_NAME}" ExportOptions.plist

      # Populates Vendor/ffmpeg-kit from our own release asset. Upstream
      # ffmpeg-kit binaries were removed from CocoaPods in April 2025, so
      # `pod install` cannot resolve them any more — see FFMPEG.md.
      - name: Fetch FFmpegKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-ffmpegkit.sh

      - name: Install toolchain and dependencies
        run: |
          brew install xcodegen
          xcodegen generate
          pod install --repo-update

      - name: Cache whisper model
        uses: actions/cache@v4
        id: model-cache
        with:
          path: PrivateMediaStudio/Resources/Models/${{ env.WHISPER_MODEL }}
          key: whisper-model-${{ env.WHISPER_MODEL }}

      - name: Download whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p PrivateMediaStudio/Resources/Models
          curl -L "$WHISPER_MODEL_URL" -o "PrivateMediaStudio/Resources/Models/$WHISPER_MODEL"

      # CURRENT_PROJECT_VERSION is pinned to "1" in project.yml; App Store
      # Connect rejects a build whose (version, build) pair it has already
      # seen, so the run number supplies a monotonic build number.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace PrivateMediaStudio.xcworkspace \
            -scheme PrivateMediaStudio \
            -configuration Release \
            -archivePath build/PrivateMediaStudio.xcarchive \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcbeautify

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PrivateMediaStudio.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/ipa/PrivateMediaStudio.ipa -t ios \
            --apiKey "$APPSTORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_API_ISSUER_ID"

      # The .ipa itself is not uploaded as an artifact: it embeds
      # embedded.mobileprovision, which contains the Team ID and bundle ID.
      - name: Clean up keychain
        if: always()
        run: security delete-keychain ci.keychain || true
