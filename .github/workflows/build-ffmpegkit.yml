name: Build FFmpegKit (one-off)

# The upstream FFmpegKit project is retired: its prebuilt binaries were pulled
# from CocoaPods on 2025-04-01 and the repository was archived read-only in
# June 2025, so `pod 'ffmpeg-kit-ios-full-gpl'` now 404s on download. The
# source still builds fine, so this workflow compiles our own xcframework
# bundle on a macOS runner and publishes it as a release asset on THIS repo.
#
# Deliberately not using one of the community mirror podspecs: those serve an
# unsigned, unaudited binary from a third-party account into an app whose
# whole premise is that media never leaves the device, and they can disappear
# exactly the way the original did.
#
# Run this manually once (Actions -> Build FFmpegKit -> Run workflow). It
# takes roughly 45-90 minutes and macOS runner minutes bill at 10x, so it is
# not wired into the normal CI path.

on:
  workflow_dispatch:
    inputs:
      ffmpegkit_ref:
        description: "ffmpeg-kit git tag or commit to build"
        type: string
        default: "v6.0"
      release_tag:
        description: "Release tag to publish the bundle under"
        type: string
        default: "ffmpegkit-6.0-custom"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install build prerequisites
        run: brew install autoconf automake libtool pkg-config nasm cmake gcc gperf

      - name: Clone ffmpeg-kit source
        run: |
          git clone https://github.com/arthenica/ffmpeg-kit.git ffmpeg-kit-src
          cd ffmpeg-kit-src
          git checkout "${{ inputs.ffmpegkit_ref }}"

      # NOTE ON LICENSING — read before adding flags here.
      #
      # FFmpegKit configures FFmpeg with --enable-version3, so the output is
      # LGPL v3.0 unless --enable-gpl is passed, at which point it becomes GPL
      # v3.0. GPL is incompatible with App Store distribution, so this build
      # deliberately omits --enable-gpl and every GPL library (x264, x265,
      # xvidcore, vid.stab, rubberband).
      #
      # We lose nothing the editor actually uses:
      #   - libass (subtitle burn-in) is ISC licensed, not GPL
      #   - HEVC encoding comes from the built-in hardware VideoToolbox
      #     encoder rather than libx265, which is both legal here and much
      #     faster on device
      #
      # If you ever add --enable-gpl you must also abandon App Store plans.
      #
      # Architectures: arm64 for devices, arm64-simulator for the CI simulator
      # job on Apple-silicon runners. Everything else is dead weight.
      - name: Build xcframework bundle
        working-directory: ffmpeg-kit-src
        run: |
          ./ios.sh \
            --xcframework \
            --target=17.0 \
            --enable-libass \
            --enable-fontconfig \
            --enable-freetype \
            --enable-fribidi \
            --enable-ios-audiotoolbox \
            --enable-ios-avfoundation \
            --enable-ios-videotoolbox \
            --enable-ios-bzip2 \
            --enable-ios-zlib \
            --enable-ios-libiconv \
            --disable-armv7 \
            --disable-armv7s \
            --disable-arm64e \
            --disable-i386 \
            --disable-x86-64 \
            --disable-x86-64-mac-catalyst \
            --disable-arm64-mac-catalyst

      - name: Package the bundle
        run: |
          BUNDLE=ffmpeg-kit-src/prebuilt/bundle-apple-xcframework-ios
          test -d "$BUNDLE" || { echo "build produced no bundle dir"; exit 1; }
          ls -1 "$BUNDLE"
          mkdir -p out
          cp -R "$BUNDLE"/*.xcframework out/
          # Ship the licence texts alongside the binaries — LGPL compliance
          # requires them, and it keeps Settings' acknowledgements honest.
          cp ffmpeg-kit-src/LICENSE out/LICENSE-ffmpeg-kit.txt || true
          cd out && zip -rq ../ffmpeg-kit-ios-custom.zip . && cd ..
          ls -lh ffmpeg-kit-ios-custom.zip

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --title "FFmpegKit ${{ inputs.ffmpegkit_ref }} (LGPL, custom build)" \
            --notes "Self-built from arthenica/ffmpeg-kit@${{ inputs.ffmpegkit_ref }}. LGPL v3.0 — no GPL libraries enabled. Consumed by Podfile via Vendor/ffmpeg-kit." \
            ffmpeg-kit-ios-custom.zip \
          || gh release upload "${{ inputs.release_tag }}" ffmpeg-kit-ios-custom.zip --clobber
