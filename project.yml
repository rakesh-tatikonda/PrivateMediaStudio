name: PrivateMediaStudio
options:
  bundleIdPrefix: __BUNDLE_ID__
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Pinned to a tag, not a branch. The default branch here is `master` (not
  # `main`, which is what broke resolution), but tracking any branch is a
  # reproducibility hazard: XcodeGen regenerates the .xcodeproj on every CI
  # run, so Package.resolved never survives and an unpinned dependency would
  # silently drift between builds.
  SwiftWhisper:
    url: https://github.com/exPHAT/SwiftWhisper
    exactVersion: 1.2.0

targets:
  PrivateMediaStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrivateMediaStudio
    resources:
      - path: PrivateMediaStudio/Resources
      - path: PrivateMediaStudio/Assets.xcassets
    dependencies:
      - package: SwiftWhisper
    # NOTE: deliberately no `info:` block. XcodeGen's `info:` GENERATES an
    # Info.plist at the given path, overwriting whatever is there — it does not
    # merely reference it. With `info.path` pointing at our hand-maintained
    # plist, every run silently replaced 80 lines of usage descriptions,
    # background modes and orientations with a stub. Setting INFOPLIST_FILE
    # instead makes Xcode consume the file as-is.
    settings:
      base:
        INFOPLIST_FILE: PrivateMediaStudio/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: false
        SWIFT_STRICT_CONCURRENCY: minimal
        # Without this the catalog compiles but CFBundleIconName is never
        # written into Info.plist, which App Store validation rejects.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Signing is Release-only so simulator/Debug builds (and fork PRs,
        # which get no secrets) never need a certificate or profile.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: "__TEAM_ID__"
          PROVISIONING_PROFILE_SPECIFIER: "__PROFILE_NAME__"
    scheme:
      testTargets: []
      gatherCoverageData: false

schemes:
  PrivateMediaStudio:
    build:
      targets:
        PrivateMediaStudio: all
    run:
      config: Debug
    archive:
      config: Release
