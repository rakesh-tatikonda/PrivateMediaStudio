name: PrivateMediaStudio
options:
  bundleIdPrefix: com.privatemediastudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftWhisper:
    url: https://github.com/exPHAT/SwiftWhisper
    branch: main

targets:
  PrivateMediaStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrivateMediaStudio
    resources:
      - path: PrivateMediaStudio/Resources
    dependencies:
      - package: SwiftWhisper
    info:
      path: PrivateMediaStudio/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatemediastudio.app
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: false
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      testTargets: []
      gatherCoverageData: false

schemes:
  PrivateMediaStudio:
    build:
      targets:
        PrivateMediaStudio: all
    run:
      config: Debug
    archive:
      config: Release
